[project]
name = "finisterra-mcp"
version = "0.1.0"
description = "MCP server for the FINISTERRA excavation database"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project.scripts]
finisterra-mcp = "server:mcp.run"
